name: 06-Git-With-Multiple-Steps
on:
  workflow_dispatch
jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Install Dependencies
          run: npm install

        - name: Run Tests
          run: npm test

        - name: Deploy Script
          run: ./deploy.sh
